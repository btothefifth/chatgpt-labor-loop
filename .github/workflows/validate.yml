name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -B -m py_compile scripts/labor_loop.py scripts/validate_artifact.py scripts/test_labor_loop.py
      - name: Run local tests
        run: python -B scripts/test_labor_loop.py
